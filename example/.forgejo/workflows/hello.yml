name: hello

# Build on the Forgejo runner (vm-115), push to the internal registry. vm-209
# polls the tag every minute and rolls the new digest out with a start-first
# update (no downtime).
on:
  push:
    branches: [master]

jobs:
  build-and-push:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --network=host \
            --build-arg SCCACHE_REDIS=redis://sccache.lsck0.dev \
            -t registry.lsck0.dev/hello:latest \
            -t registry.lsck0.dev/hello:${{ github.sha }} \
            .

      - name: Push to registry
        run: |
          docker push registry.lsck0.dev/hello:latest
          docker push registry.lsck0.dev/hello:${{ github.sha }}
