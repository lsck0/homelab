name: hello

# build on vm-117 (rootless), vm-209 polls the registry
on:
    push:
        branches: [master]

jobs:
    build-and-push:
        runs-on: docker
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Build image
              run: |
                  docker build \
                    --network=host \
                    --secret id=sccache_redis,env=SCCACHE_REDIS \
                    -t registry.lsck0.dev/hello:latest \
                    -t registry.lsck0.dev/hello:${{ github.sha }} \
                    .

            # the push credential is a repo secret (sops: registry-push-password); the runner holds none
            - name: Log in to the registry
              env:
                  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
              run: printf '%s' "$REGISTRY_PASSWORD" | docker login registry.lsck0.dev -u ci --password-stdin

            - name: Push to registry
              run: |
                  docker push registry.lsck0.dev/hello:latest
                  docker push registry.lsck0.dev/hello:${{ github.sha }}
