# Opens a pull request for every branch Hermes (vm-113) pushes under hermes/.
# Its deploy key can push branches but not master (ruleset from
# src/scripts/hermes-secrets.sh), so review, merge and ./sync.sh stay with the owner.
name: hermes-pr

on:
  push:
    branches: ["hermes/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  pull-request:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Open the pull request unless one is already open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" -gt 0 ]; then
            echo "pull request for $BRANCH is already open"
            exit 0
          fi

          # title: the first commit's subject; body: every commit message, oldest first
          messages=$(gh api "repos/$GH_REPO/compare/$BASE...$BRANCH" --jq '[.commits[].commit.message]')
          if [ "$(jq length <<< "$messages")" -eq 0 ]; then
            echo "$BRANCH has no commits on top of $BASE"
            exit 0
          fi
          title=$(jq -r '.[0] | split("\n")[0]' <<< "$messages")
          {
            jq -r 'join("\n\n---\n\n")' <<< "$messages"
            printf '\n---\nPushed by Hermes (vm-113). Deploy after merging with `./sync.sh`.\n'
          } > "$RUNNER_TEMP/body.md"

          gh pr create --base "$BASE" --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
