name: hello

# builds example/ to ghcr, vm-209 polls it
on:
  push:
    branches: [master]
    paths:
      - 'example/**'
      - '.github/workflows/hello.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: example
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hello:latest
            ghcr.io/${{ github.repository_owner }}/hello:${{ github.sha }}
